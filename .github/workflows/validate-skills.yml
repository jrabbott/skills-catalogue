name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate skills
        run: npm run validate

      - name: Build catalogue
        run: npm run build:catalogue

      - name: Check generated catalogue
        run: |
          test -f catalogue/skills.json
          git ls-files --error-unmatch catalogue/skills.json
          git diff --exit-code -- catalogue/skills.json

      - name: Build collections
        run: npm run build:collections

      - name: Check generated collections
        run: |
          test -d collections
          test -z "$(git ls-files --others --exclude-standard -- collections/)"
          git diff --exit-code -- collections/
